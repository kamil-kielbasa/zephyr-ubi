name: build and test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twister:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Has to match "self: path:" in west.yml, or west will not find
          # this repository in the workspace it is about to create.
          path: zephyr-ubi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up the Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: zephyr-ubi
          toolchains: x86_64-zephyr-elf

      - name: Install what native_sim needs to link 32-bit
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-multilib \
            g++-multilib

      - name: Build and run every configuration
        working-directory: zephyr-ubi
        run: west twister -T tests -p native_sim --inline-logs

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-report
          path: zephyr-ubi/twister-out/twister.xml
          if-no-files-found: ignore
