name: CI / Re-run

on:
  workflow_run:
    workflows: [CI / Zephyr]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    name: Re-run after a failed Zephyr setup or a GitHub error
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A setup that fails twice points at the runner; failed tests are never re-run.
      - name: Re-run the run if neither a test nor a build failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          verdict=$(gh run view "$RUN_ID" --json jobs --jq '
            if all(.jobs[]; .conclusion == "success" or .conclusion == "skipped")
            then "all"
            else [.jobs[] | select(.conclusion == "failure")]
              | if length > 0 and all(.[]; all(.steps[] | select(.conclusion == "failure");
                  .name | startswith("Set up the Zephyr workspace")))
                then "failed" else "keep" end
            end')
          echo "Run $RUN_ID: $verdict"
          # Every job passed, so GitHub failed the run, e.g. by never starting a job.
          if [ "$verdict" = all ]; then
            gh run rerun "$RUN_ID"
          fi
          if [ "$verdict" = failed ]; then
            gh run rerun "$RUN_ID" --failed
          fi
