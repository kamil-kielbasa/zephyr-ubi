CONFIG_ARCH_POSIX_LIBFUZZER=y

CONFIG_UBI=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_ENTROPY_GENERATOR=y

# Memory errors and undefined behaviour stop the run as a crash would.
CONFIG_ASAN=y
CONFIG_UBSAN=y

# Every rejected input would be logged.
CONFIG_LOG=n
