CONFIG_ZTEST=y
CONFIG_UBI=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_ENTROPY_GENERATOR=y

# The device handle and its per-block bookkeeping come from here.
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_UBI_MAX_NR_OF_VOLUMES=4

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_LOG=y
CONFIG_UBI_LOG_LEVEL_WRN=y

# Real NOR lets a write clear bits in an already written byte; the
# simulator refuses unless this is on, and a test needs to model an
# attacker doing exactly that.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y

CONFIG_FLASH_SIMULATOR_CALLBACKS=y
