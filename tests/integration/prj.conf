CONFIG_ZTEST=y
CONFIG_UBI=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_ENTROPY_GENERATOR=y

# Handle and block tables; 2048 blocks of 4 KiB take about 17 KiB.
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_UBI_MAX_NR_OF_VOLUMES=4

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_LOG=y
CONFIG_UBI_LOG_LEVEL_WRN=y
