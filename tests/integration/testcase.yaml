tests:
  # The stock simulator: 4 KiB pages, single-byte writes.
  ubi.integration:
    platform_allow:
      - native_sim
    tags:
      - ubi
    integration_platforms:
      - native_sim
  # Geometries of real parts, each with its own write granularity.
  ubi.integration.nrf5340:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_args:
      - DTC_OVERLAY_FILE=native_sim/nrf5340_flash.overlay
  ubi.integration.stm32u5:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_args:
      - DTC_OVERLAY_FILE=native_sim/stm32u5_flash.overlay
  ubi.integration.mx25r64:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_args:
      - DTC_OVERLAY_FILE=native_sim/mx25r64_flash.overlay
  # Switches that change what the library does.
  ubi.integration.verify_on_read:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_configs:
      - CONFIG_UBI_VERIFY_ON_READ=y
  ubi.integration.self_checks:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_configs:
      - CONFIG_UBI_SELF_CHECKS=y
  # The ends of two ranges.
  ubi.integration.eager_state_check:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_configs:
      - CONFIG_UBI_STATE_CHECK_INTERVAL=1
  ubi.integration.no_protection:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_configs:
      - CONFIG_UBI_PROTECTION_CYCLES=0
  # The nRF5340 DK's MX25R64, all 8 MiB. Tests that need the simulator's
  # counters or injected faults are not built here.
  ubi.integration.hardware:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
    tags:
      - ubi
    slow: true
    timeout: 7200
  ubi.integration.hardware.64k:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
    tags:
      - ubi
    slow: true
    timeout: 7200
    extra_configs:
      - CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=65536
  ubi.integration.hardware.verify_on_read:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
    tags:
      - ubi
    slow: true
    timeout: 7200
    extra_configs:
      - CONFIG_UBI_VERIFY_ON_READ=y
  ubi.integration.hardware.self_checks:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
    tags:
      - ubi
    slow: true
    timeout: 7200
    extra_configs:
      - CONFIG_UBI_SELF_CHECKS=y
  ubi.integration.hardware.eager_state_check:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
    tags:
      - ubi
    slow: true
    timeout: 7200
    extra_configs:
      - CONFIG_UBI_STATE_CHECK_INTERVAL=1
  ubi.integration.hardware.no_protection:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
    tags:
      - ubi
    slow: true
    timeout: 7200
    extra_configs:
      - CONFIG_UBI_PROTECTION_CYCLES=0
