tests:
  # The stock simulator: one byte per write, so nothing has to be aligned or
  # padded. Every other scenario exists because that is not what real parts
  # do.
  ubi.integration:
    platform_allow:
      - native_sim
    tags:
      - ubi
    integration_platforms:
      - native_sim
  ubi.integration.nrf5340:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=nrf5340.overlay
  ubi.integration.stm32u5:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=stm32u5.overlay
  # The two switches that change what the library does rather than what the
  # flash underneath it looks like.
  ubi.integration.verify_on_read:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_configs:
      - CONFIG_UBI_VERIFY_ON_READ=y
  ubi.integration.self_checks:
    platform_allow:
      - native_sim
    tags:
      - ubi
    extra_configs:
      - CONFIG_UBI_SELF_CHECKS=y
