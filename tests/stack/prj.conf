CONFIG_ZTEST=y
CONFIG_UBI=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_ENTROPY_GENERATOR=y

# The device handle and its per-block bookkeeping come from here.
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_UBI_MAX_NR_OF_VOLUMES=4

# A relocation falls due within a few seconds of erases.
CONFIG_UBI_WEAR_LEVELING_THRESHOLD=64

# Stacks start out filled with a pattern, so that what was never touched shows.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Measured as Operations quotes it, without logging.
CONFIG_TEST_LOGGING_DEFAULTS=n
CONFIG_LOG=n

# The helpers that damage the flash run on the test thread, not on the one
# measured.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
