CONFIG_ZTEST=y
CONFIG_UBI=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_ENTROPY_GENERATOR=y

# The device handle and its per-block bookkeeping come from here.
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_UBI_MAX_NR_OF_VOLUMES=4

# Levelling has to have work within one run.
CONFIG_UBI_WEAR_LEVELING_THRESHOLD=64

# The library checks its own bookkeeping after every call.
CONFIG_UBI_SELF_CHECKS=y

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ZTEST_STACK_SIZE=16384

# Every fault injected would be logged.
CONFIG_LOG=y
CONFIG_UBI_LOG_LEVEL_OFF=y
